<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حكاياتي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Markazi+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#050403;
    --bg:#0a0908;
    --paper:#ede4cd;
    --paper-shadow:#cbc0a3;
    --ink:#2a2418;
    --ink-soft:#6b6250;
    --line:rgba(42,36,24,.12);
    --amber:#cf9f52;
    --amber-dim:#8a6a34;
    --danger:#c96a5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--bg-deep);}
  body{
    font-family:'Markazi Text','Noto Naskh Arabic',serif;
    color:var(--paper);
  }
  button, input, textarea{font-family:inherit;}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg-deep);}
  #book{display:none;}
  #book.visible{display:flex;}
  #lock-screen.hidden{display:none;}

  /* ---------- lock screen ---------- */
  #lock-screen{align-items:center;justify-content:center;}
  .bokeh{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(70px 70px at 14% 22%, rgba(255,214,150,.20), transparent 70%),
      radial-gradient(100px 100px at 86% 16%, rgba(255,214,150,.13), transparent 70%),
      radial-gradient(80px 80px at 80% 80%, rgba(255,214,150,.16), transparent 70%),
      radial-gradient(55px 55px at 10% 84%, rgba(255,214,150,.11), transparent 70%),
      radial-gradient(40px 40px at 50% 92%, rgba(255,214,150,.10), transparent 70%);
    filter:blur(1.5px);
    animation:bokeh-pulse 9s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){ .bokeh{animation:none;} }
  @keyframes bokeh-pulse{0%,100%{opacity:.65;}50%{opacity:1;}}

  .lock-card{position:relative;z-index:1;text-align:center;padding:32px;max-width:380px;width:88%;}
  .book-title{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:clamp(46px,15vw,68px);
    margin:0 0 6px;color:var(--paper);text-shadow:0 0 34px rgba(207,159,82,.22);}
  .book-sub{color:var(--paper-shadow);font-size:18px;margin:0 0 34px;opacity:.7;}

  .meter{background:#111;border:1px solid rgba(207,159,82,.35);border-radius:6px;
    padding:14px 18px;margin-bottom:20px;box-shadow:inset 0 0 22px rgba(0,0,0,.65);}
  .meter-label{display:block;font-size:13px;color:var(--amber-dim);margin-bottom:8px;letter-spacing:2px;}
  .meter-input{width:100%;background:transparent;border:none;outline:none;
    text-align:center;font-family:'Courier New',monospace;font-size:30px;letter-spacing:10px;
    color:var(--amber);text-shadow:0 0 12px rgba(207,159,82,.55);}
  .meter-input::placeholder{color:rgba(207,159,82,.22);}

  .unlock-btn{background:var(--amber);color:#1c1408;border:none;border-radius:999px;
    padding:14px 42px;font-family:'Aref Ruqaa',serif;font-size:19px;cursor:pointer;
    box-shadow:0 8px 22px rgba(207,159,82,.25);transition:transform .15s ease;}
  .unlock-btn:active{transform:scale(.96);}
  .pw-error{color:var(--danger);font-size:14px;margin-top:16px;min-height:18px;}

  /* ---------- book screen ---------- */
  #book{background:var(--bg-deep);}
  .book-header{display:flex;align-items:center;justify-content:space-between;
    padding:calc(12px + env(safe-area-inset-top)) 16px 10px;flex:0 0 auto;}
  .header-title{font-family:'Aref Ruqaa',serif;font-size:19px;color:var(--paper-shadow);}
  .icon-btn{background:none;border:none;color:var(--amber-dim);font-size:19px;cursor:pointer;
    padding:8px 10px;border-radius:8px;}
  .icon-btn:active{color:var(--amber);}

  .stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
    padding:6px 18px;min-height:0;perspective:1500px;}
  .page-stack{position:relative;width:min(90vw,440px);height:min(68vh,600px);}
  .page-shadow{position:absolute;inset:0;background:var(--paper-shadow);border-radius:5px;}
  .s3{transform:translate(7px,7px) rotate(1.3deg);opacity:.28;}
  .s2{transform:translate(5px,5px) rotate(-.9deg);opacity:.45;}
  .s1{transform:translate(2.5px,2.5px) rotate(.45deg);opacity:.65;}

  .page{position:absolute;inset:0;background:var(--paper);border-radius:5px;
    box-shadow:0 20px 44px rgba(0,0,0,.55);
    padding:22px;display:flex;flex-direction:column;
    transform-origin:right center;
    transition:transform .26s ease, opacity .26s ease;
    overflow:hidden;}
  .page.flip-next{transform:rotateY(-68deg);opacity:.25;}
  .page.flip-prev{transform:rotateY(68deg);opacity:.25;}

  .page-image-wrap{flex:1;display:flex;align-items:center;justify-content:center;}
  .page-image-wrap img{max-width:100%;max-height:100%;border-radius:2px;box-shadow:0 8px 20px rgba(0,0,0,.35);}

  .page-text{flex:1;width:100%;
    background:repeating-linear-gradient(var(--paper),var(--paper) 32px,var(--line) 33px);
    background-attachment:local;border:none;outline:none;resize:none;
    font-family:'Markazi Text',serif;font-size:21px;line-height:33px;color:var(--ink);
    direction:rtl;text-align:right;}
  .page-text::placeholder{color:var(--ink-soft);opacity:.7;}

  .book-footer{display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px calc(22px + env(safe-area-inset-bottom));flex:0 0 auto;gap:12px;}
  .nav-btn{background:rgba(207,159,82,.12);border:1px solid rgba(207,159,82,.32);color:var(--amber);
    width:44px;height:44px;min-width:44px;border-radius:50%;font-size:21px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .nav-btn:disabled{opacity:.3;}
  .nav-btn:active{transform:scale(.94);}
  .page-indicator{color:var(--paper-shadow);font-size:14px;text-align:center;flex:1;}
  .page-indicator b{color:var(--paper);font-weight:600;}
  .save-state{display:block;font-size:12px;color:var(--amber-dim);min-height:15px;margin-top:3px;}

  /* ---------- jump modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;
    align-items:center;justify-content:center;z-index:20;padding:20px;}
  .modal[hidden]{display:none;}
  .modal-card{background:var(--paper);color:var(--ink);border-radius:8px;padding:22px;
    width:100%;max-width:300px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .modal-card p{margin:0 0 14px;font-size:16px;}
  .modal-card input{width:100%;padding:10px;border:1px solid var(--paper-shadow);border-radius:6px;
    font-size:18px;text-align:center;background:#fff;color:var(--ink);outline:none;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;padding:10px;border-radius:6px;border:none;font-size:15px;cursor:pointer;}
  #jump-cancel{background:#ddd3ba;color:var(--ink);}
  #jump-go{background:var(--amber);color:#1c1408;font-weight:600;}
</style>
</head>
<body>

  <div id="lock-screen" class="screen">
    <div class="bokeh" aria-hidden="true"></div>
    <div class="lock-card">
      <h1 class="book-title">حكاياتي</h1>
      <p class="book-sub">أربعمية صفحة… وكل صفحة تنتظر حكايتك</p>
      <div class="meter">
        <label class="meter-label" for="pw">كلمة السر</label>
        <input id="pw" class="meter-input" type="password" inputmode="numeric" maxlength="10" autocomplete="off" placeholder="••••">
      </div>
      <button id="unlock-btn" class="unlock-btn">افتح الكتاب</button>
      <p id="pw-error" class="pw-error"></p>
    </div>
  </div>

  <div id="book" class="screen">
    <header class="book-header">
      <button id="lock-again" class="icon-btn" title="قفل الكتاب">🔒</button>
      <span class="header-title">حكاياتي</span>
      <button id="jump-btn" class="icon-btn" title="انتقل لصفحة">＃</button>
    </header>

    <main class="stage">
      <div class="page-stack">
        <div class="page-shadow s3"></div>
        <div class="page-shadow s2"></div>
        <div class="page-shadow s1"></div>
        <div id="page" class="page">
          <div id="page-image-wrap" class="page-image-wrap" hidden>
            <img id="page-image" alt="صفحة من الكتاب">
          </div>
          <textarea id="page-text" class="page-text" placeholder="اكتب حكايتك هنا…" hidden></textarea>
        </div>
      </div>
    </main>

    <footer class="book-footer">
      <button id="prev-btn" class="nav-btn" aria-label="الصفحة السابقة">›</button>
      <div class="page-indicator">
        صفحة <b id="page-num">1</b> من 400
        <span id="save-state" class="save-state"></span>
      </div>
      <button id="next-btn" class="nav-btn" aria-label="الصفحة التالية">‹</button>
    </footer>
  </div>

  <div id="jump-modal" class="modal" hidden>
    <div class="modal-card">
      <p>روح لصفحة رقم (1 – 400)</p>
      <input id="jump-input" type="number" min="1" max="400" inputmode="numeric">
      <div class="modal-actions">
        <button id="jump-cancel">إلغاء</button>
        <button id="jump-go">روح</button>
      </div>
    </div>
  </div>

  };

  var lockScreen = document.getElementById("lock-screen");
  var bookEl = document.getElementById("book");
  var pwInput = document.getElementById("pw");
  var unlockBtn = document.getElementById("unlock-btn");
  var pwError = document.getElementById("pw-error");

  var pageImageWrap = document.getElementById("page-image-wrap");
  var pageImageEl = document.getElementById("page-image");
  var pageTextEl = document.getElementById("page-text");
  var pageEl = document.getElementById("page");
  var pageNumEl = document.getElementById("page-num");
  var saveStateEl = document.getElementById("save-state");
  var prevBtn = document.getElementById("prev-btn");
  var nextBtn = document.getElementById("next-btn");

  var jumpModal = document.getElementById("jump-modal");
  var jumpInput = document.getElementById("jump-input");

  var db = null;
  var currentPage = 1;
  var saveTimer = null;
  var isFlipping = false;

  function safeLS(fn, fallback){
    try { return fn(); } catch(e){ return fallback; }
  }

  function tryUnlock(){
    var val = pwInput.value.trim();
    if(val === PASSWORD){
      pwError.textContent = "";
      openBook();
    } else {
      pwError.textContent = "كلمة السر غلط، جرّب مرة ثانية";
      pwInput.value = "";
      pwInput.focus();
    }
  }
  unlockBtn.addEventListener("click", tryUnlock);
  pwInput.addEventListener("keydown", function(e){ if(e.key === "Enter") tryUnlock(); });

  async function openBook(){
    lockScreen.classList.add("hidden");
    bookEl.classList.add("visible");

    if (typeof claude !== "undefined" && claude.use) {
      try { db = await claude.use("db"); } catch(e){ db = null; }
    }

    var start = 1;
    try {
      if (db) {
        var doc = await db.doc("meta/bookmark").get();
        if (doc && doc.data && doc.data.page) start = doc.data.page;
      } else {
        var v = safeLS(function(){ return localStorage.getItem("hikayati_bookmark"); }, null);
        if (v) start = parseInt(v, 10) || 1;
      }
    } catch(e){}
    if (start < 1 || start > TOTAL_PAGES) start = 1;
    await renderPage(start);
  }

  document.getElementById("lock-again").addEventListener("click", function(){
    bookEl.classList.remove("visible");
    lockScreen.classList.remove("hidden");
    pwInput.value = "";
    pwError.textContent = "";
    pwInput.focus();
  });

  async function loadPageContent(n){
    if (IMAGES[n]) {
      pageImageWrap.hidden = false;
      pageTextEl.hidden = true;
      pageImageEl.src = IMAGES[n];
    } else {
      pageImageWrap.hidden = true;
      pageTextEl.hidden = false;
      var text = "";
      try {
        if (db) {
          var doc = await db.doc("pages/p" + n).get();
          text = (doc && doc.data && doc.data.text) || "";
        } else {
          text = safeLS(function(){ return localStorage.getItem("hikayati_page_" + n); }, "") || "";
        }
      } catch(e){}
      pageTextEl.value = text;
    }
  }

  function saveBookmark(n){
    try {
      if (db) { db.doc("meta/bookmark").set({ page: n }); }
      else { safeLS(function(){ localStorage.setItem("hikayati_bookmark", String(n)); }); }
    } catch(e){}
  }

  function updateNavButtons(){
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= TOTAL_PAGES;
  }

  async function renderPage(n){
    n = Math.max(1, Math.min(TOTAL_PAGES, n));
    currentPage = n;
    pageNumEl.textContent = n;
    saveStateEl.textContent = "";
    await loadPageContent(n);
    updateNavButtons();
    saveBookmark(n);
  }

  var debounceSave;
  pageTextEl.addEventListener("input", function(){
    saveStateEl.textContent = "جارٍ الحفظ…";
    clearTimeout(debounceSave);
    var n = currentPage;
    var text = pageTextEl.value;
    debounceSave = setTimeout(async function(){
      try {
        if (db) {
          await db.doc("pages/p" + n).set({ text: text, updatedAt: Date.now() });
        } else {
          safeLS(function(){ localStorage.setItem("hikayati_page_" + n, text); });
        }
        if (currentPage === n) {
          saveStateEl.textContent = "تم الحفظ";
          setTimeout(function(){ if (saveStateEl.textContent === "تم الحفظ") saveStateEl.textContent = ""; }, 1400);
        }
      } catch(e){
        if (currentPage === n) saveStateEl.textContent = "تعذر الحفظ";
      }
    }, 700);
  });

  async function flipTo(n, dir){
    if (n < 1 || n > TOTAL_PAGES || isFlipping || n === currentPage) return;
    isFlipping = true;
    pageEl.classList.add(dir === "next" ? "flip-next" : "flip-prev");
    setTimeout(async function(){
      await renderPage(n);
      pageEl.classList.remove("flip-next", "flip-prev");
      isFlipping = false;
    }, 240);
  }

  prevBtn.addEventListener("click", function(){ flipTo(currentPage - 1, "prev"); });
  nextBtn.addEventListener("click", function(){ flipTo(currentPage + 1, "next"); });

  document.addEventListener("keydown", function(e){
    if (!bookEl.classList.contains("visible")) return;
    if (document.activeElement === pageTextEl) return;
    if (e.key === "ArrowLeft") flipTo(currentPage + 1, "next");
    if (e.key === "ArrowRight") flipTo(currentPage - 1, "prev");
  });

  var touchX = null;
  var stage = document.querySelector(".stage");
  stage.addEventListener("touchstart", function(e){ touchX = e.touches[0].clientX; }, { passive:true });
  stage.addEventListener("touchend", function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 55) {
      if (dx < 0) flipTo(currentPage + 1, "next");
      else flipTo(currentPage - 1, "prev");
    }
    touchX = null;
  }, { passive:true });

  document.getElementById("jump-btn").addEventListener("click", function(){
    jumpInput.value = currentPage;
    jumpModal.hidden = false;
    jumpInput.focus();
  });
  document.getElementById("jump-cancel").addEventListener("click", function(){ jumpModal.hidden = true; });
  jumpModal.addEventListener("click", function(e){ if (e.target === jumpModal) jumpModal.hidden = true; });
  document.getElementById("jump-go").addEventListener("click", function(){
    var n = parseInt(jumpInput.value, 10);
    jumpModal.hidden = true;
    if (!isNaN(n)) flipTo(n, n > currentPage ? "next" : "prev");
  });
  jumpInput.addEventListener("keydown", function(e){ if (e.key === "Enter") document.getElementById("jump-go").click(); });

})();
</script>
